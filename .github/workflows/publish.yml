# Publishes to PyPI via Trusted Publishing (no API token needed).
# One-time setup on pypi.org: Account -> Publishing -> "Add a new pending publisher"
#   PyPI project name: skilldistill
#   Owner: palasht75   Repository: skilldistill
#   Workflow name: publish.yml   Environment name: pypi
# Then: create a GitHub release (tag v0.1.0) and this workflow uploads it.
name: publish
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
